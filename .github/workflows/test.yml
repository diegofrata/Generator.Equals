name: Test

on:
  push:
    branches:
      - '*'
  pull_request:      

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify line endings are LF
      run: |
        bad=$(git ls-files --eol | grep -E 'i/crlf|i/mixed' || true)
        if [ -n "$bad" ]; then
          echo "$bad"
          echo "::error::Files with CRLF or mixed line endings are committed; this repository enforces LF (see .gitattributes)"
          exit 1
        fi
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Test
      run: dotnet test --no-restore --verbosity normal -f net10.0